name: Data quality check

on:
  pull_request:
    paths:
      - 'data/**'
      - 'tools/check_observations.py'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/check_observations.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check observations and summarize counts
        run: |
          set +e
          python3 tools/check_observations.py --report out > data-check-summary.txt
          result=$?
          set -e
          cat data-check-summary.txt
          {
            echo '### Data quality check'
            echo '```text'
            cat data-check-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-check
          path: out/
          if-no-files-found: error

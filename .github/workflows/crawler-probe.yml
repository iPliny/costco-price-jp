name: Crawler probe (online price dry run)

# Read-only dry run from GitHub's network: fetch costco.co.jp
# online prices for tracked item numbers. Nothing is written to main.
on:
  push:
    branches: [crawler/probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render one discounted item in a browser
        run: |
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/render_probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            data/online_fetch.csv

name: Crawler probe (robots.txt check)

# One-off, read-only check run from GitHub's network: fetch costco.co.jp's
# robots.txt and a single product page. No data is written to the site.
on:
  push:
    branches: [crawler/probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch robots.txt
        run: |
          UA="costco-price-jp research bot (+https://ipliny.github.io/costco-price-jp/)"
          curl -sS -A "$UA" -D robots.headers -o robots.txt -w "status %{http_code}\n" https://www.costco.co.jp/robots.txt || true
          cat robots.headers || true
          echo "===== robots.txt ====="
          cat robots.txt || true
      - name: Fetch one product page (RICO 1492255)
        run: |
          UA="costco-price-jp research bot (+https://ipliny.github.io/costco-price-jp/)"
          sleep 5
          curl -sS -A "$UA" -o product.html -w "status %{http_code}\n" https://www.costco.co.jp/c/RICO-BABY-WIPES-900CT/p/1492255 || true
          wc -c product.html || true
          echo "===== price-like snippets ====="
          grep -oE '(ld\+json|"price"[^,]{0,40}|¥ ?[0-9,]{3,}|オンライン価格|割引価格は[^<]{0,60})' product.html | sort | uniq -c | head -40 || true
          echo "===== terms links ====="
          grep -oE 'href="[^"]*(erms|olicy|規約)[^"]*"' product.html | sort -u | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            robots.txt
            robots.headers
            product.html

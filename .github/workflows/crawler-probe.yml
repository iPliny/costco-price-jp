name: Crawler probe (online price dry run)

# Read-only dry run from GitHub's network: fetch costco.co.jp online prices for
# products we track in a warehouse. Nothing is written to main.
on:
  push:
    branches: [crawler/probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry run (fetch and merge locally, no commit)
        run: |
          python3 tools/crawl_online.py --debug --apply
          echo "===== new online rows ====="
          grep ',官網自動取得,' data/observations.csv || true
      - uses: actions/upload-artifact@v4
        with:
          name: online-dry-run
          path: |
            data/online_fetch.csv
            data/observations.csv

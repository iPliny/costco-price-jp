name: Crawler probe (online price dry run)

# Read-only dry run from GitHub's network: fetch costco.co.jp
# online prices for tracked item numbers. Nothing is written to main.
on:
  push:
    branches: [crawler/probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug price fields on three items (one with a live discount)
        run: python3 tools/crawl_online.py --debug 1492255 84838 60986
      - name: Dry run over every tracked item number
        run: python3 tools/crawl_online.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            data/online_fetch.csv

name: Crawl online prices

# Every morning 06:00 JST: fetch costco.co.jp online prices for items we track
# in a warehouse, merge them into data/observations.csv, then redeploy the site.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl-online
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # About 6.5 s per item: ~55 min for 500 items. Default job limit is 6 h.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 tools/crawl_online.py
      - uses: actions/upload-artifact@v4
        with:
          name: online-fetch
          path: data/online_fetch.csv
      - name: Merge into the latest main, commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "online-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fetch can take an hour; merge onto main as it is now, and retry if someone pushes in between.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/crawl_online.py --merge-only
            if git diff --quiet data/observations.csv data/online_match.csv; then
              echo "No price changes."
              exit 0
            fi
            git add data/observations.csv data/online_match.csv
            git commit -m "Online prices $(TZ=Asia/Tokyo date +%F)"
            if git push origin HEAD:main; then
              # Pushes made with the workflow token don't trigger other workflows, so start the deploy explicitly.
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            sleep 20
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
